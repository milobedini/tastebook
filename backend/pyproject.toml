[project]
name = "tastebook-backend"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "dj-database-url>=3.1.2",
    "django>=6.1.2",
    "django-allauth[headless,socialaccount]>=65.21.0",
    "djangorestframework>=3.18.3",
    "drf-spectacular>=0.30.0",
    "psycopg[binary]>=3.3.6",
    "sentry-sdk[django]>=2.73.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
    "pytest-env>=1.8.1",
    "responses>=0.26.3",
    "ruff>=0.17.2",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
testpaths = ["tests"]
addopts = "--strict-markers"
env = ["D:DJANGO_SECRET_KEY=test-only-secret-key"]

[tool.vercel.scripts]
# Runs after the dependencies install and before the deployment goes live: each deployment migrates its own database.
build = "python build.py"

[tool.uv]
# Ignore releases less than a day old, as pnpm does by default: most compromised releases are pulled within hours.
exclude-newer = "1 day"
