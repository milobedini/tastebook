openapi: 3.0.3
info:
  title: Tastebook API
  version: 0.1.0
  description: Recipe hub API
paths:
  /api/courses/:
    get:
      operationId: courses_list
      tags:
      - courses
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Course'
          description: ''
  /api/cuisines/:
    get:
      operationId: cuisines_list
      tags:
      - cuisines
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Cuisine'
          description: ''
  /api/health/:
    get:
      operationId: health_retrieve
      tags:
      - health
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          description: ''
  /api/ingredients/:
    get:
      operationId: ingredients_list
      tags:
      - ingredients
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/IngredientOption'
          description: ''
  /api/recipes/:
    get:
      operationId: recipes_list
      parameters:
      - in: query
        name: course
        schema:
          type: array
          items:
            type: string
        description: Recipes with any of these courses, by slug. Unknown slugs are
          dropped; with none left, nothing is filtered.
      - in: query
        name: cuisine
        schema:
          type: array
          items:
            type: string
        description: Recipes with any of these cuisines, by slug. Unknown slugs are
          dropped; with none left, nothing is filtered.
      - in: query
        name: diet
        schema:
          type: array
          items:
            enum:
            - vegetarian
            - vegan
            - gluten_free
            - dairy_free
            type: string
            description: |-
              * `vegetarian` - Vegetarian
              * `vegan` - Vegan
              * `gluten_free` - Gluten-free
              * `dairy_free` - Dairy-free
        description: Recipes with every one of these diet tags, worked out as each
          recipe's diet_tags are. Any other value is a 400.
      - in: query
        name: difficulty
        schema:
          type: array
          items:
            enum:
            - easy
            - medium
            - hard
            type: string
            description: |-
              * `easy` - Easy
              * `medium` - Medium
              * `hard` - Hard
        description: Recipes with any of these difficulties. Any other value is a
          400.
      - in: query
        name: exclude_ingredient
        schema:
          type: array
          items:
            type: string
        description: Recipes with no line, optional or not, using any of these ingredients,
          by slug. Unknown slugs exclude nothing.
      - in: query
        name: include_ingredient
        schema:
          type: array
          items:
            type: string
        description: Recipes with a line, optional or not, using any of these ingredients
          (every one with include_match=all), by slug. Unknown slugs are dropped;
          with none left, nothing is filtered.
      - in: query
        name: include_match
        schema:
          enum:
          - any
          - all
          type: string
          default: any
          minLength: 1
        description: |-
          any (or missing) means a recipe needs one of the include_ingredient ingredients; all means it needs every one of them. Any other value is a 400.

          * `any` - any
          * `all` - all
      - in: query
        name: max_cook
        schema:
          type: integer
          minimum: 1
        description: Cook time is this many minutes or fewer. A value that is not
          a whole number of at least 1 is a 400.
      - in: query
        name: max_prep
        schema:
          type: integer
          minimum: 1
        description: Prep time is this many minutes or fewer. A value that is not
          a whole number of at least 1 is a 400.
      - in: query
        name: max_total
        schema:
          type: integer
          minimum: 1
        description: Prep plus cook plus extra time is this many minutes or fewer.
          A value that is not a whole number of at least 1 is a 400.
      - in: query
        name: one_pot
        schema:
          type: boolean
          default: false
        description: true means only one-pot recipes; false or missing means every
          recipe.
      - in: query
        name: q
        schema:
          type: string
          default: ''
        description: Title, description, an ingredient's name or synonym, or a cuisine
          contains this text, ignoring case and accents. Title matches come first,
          then the others, alphabetically within each.
      tags:
      - recipes
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RecipeSummary'
          description: ''
        '400':
          description: A difficulty, a diet, an include_match or a time limit is not
            one the list accepts.
  /api/recipes/{slug}/:
    get:
      operationId: recipes_retrieve
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - recipes
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Recipe'
          description: ''
        '404':
          description: No recipe has this slug.
components:
  schemas:
    BlankEnum:
      enum:
      - ''
    Course:
      type: object
      properties:
        slug:
          type: string
          maxLength: 50
          pattern: ^[-a-zA-Z0-9_]+$
        name:
          type: string
          maxLength: 50
      required:
      - name
      - slug
    Cuisine:
      type: object
      properties:
        slug:
          type: string
          maxLength: 50
          pattern: ^[-a-zA-Z0-9_]+$
        name:
          type: string
          maxLength: 50
      required:
      - name
      - slug
    DatabaseEnum:
      enum:
      - ok
      - unavailable
      type: string
      description: |-
        * `ok` - ok
        * `unavailable` - unavailable
    DietTag:
      enum:
      - vegetarian
      - vegan
      - gluten_free
      - dairy_free
      type: string
      description: |-
        * `vegetarian` - Vegetarian
        * `vegan` - Vegan
        * `gluten_free` - Gluten-free
        * `dairy_free` - Dairy-free
    DietTagConflict:
      type: object
      properties:
        ingredient:
          allOf:
          - $ref: '#/components/schemas/Ingredient'
          readOnly: true
        diet_tags:
          type: array
          items:
            $ref: '#/components/schemas/DietTag'
          readOnly: true
      required:
      - diet_tags
      - ingredient
    DifficultyEnum:
      enum:
      - easy
      - medium
      - hard
      type: string
      description: |-
        * `easy` - Easy
        * `medium` - Medium
        * `hard` - Hard
    Equipment:
      type: object
      properties:
        slug:
          type: string
          maxLength: 50
          pattern: ^[-a-zA-Z0-9_]+$
        name:
          type: string
          maxLength: 50
      required:
      - name
      - slug
    Health:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/StatusEnum'
        database:
          $ref: '#/components/schemas/DatabaseEnum'
        version:
          type: string
      required:
      - database
      - status
      - version
    Ingredient:
      type: object
      properties:
        slug:
          type: string
          maxLength: 100
          pattern: ^[-a-zA-Z0-9_]+$
        name:
          type: string
          description: 'The UK name: courgette, coriander, plain flour.'
          maxLength: 100
      required:
      - name
      - slug
    IngredientGroup:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          description: '"For the sauce", "To serve".'
          maxLength: 100
        lines:
          type: array
          items:
            $ref: '#/components/schemas/IngredientLine'
          readOnly: true
      required:
      - id
      - lines
      - name
    IngredientLine:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        amount:
          type: number
          format: double
          maximum: 100000
          minimum: -100000
          exclusiveMaximum: true
          exclusiveMinimum: true
          nullable: true
        amount_max:
          type: number
          format: double
          maximum: 100000
          minimum: -100000
          exclusiveMaximum: true
          exclusiveMinimum: true
          nullable: true
        unit:
          description: |-
            Leave empty for "2 eggs".

            * `g` - g
            * `kg` - kg
            * `ml` - ml
            * `l` - l
            * `tsp` - tsp
            * `tbsp` - tbsp
            * `cup` - cup
            * `oz` - oz
            * `lb` - lb
            * `fl_oz` - fl oz
            * `pinch` - pinch
            * `clove` - clove
            * `tin` - tin
            * `slice` - slice
            * `bunch` - bunch
            * `handful` - handful
          oneOf:
          - $ref: '#/components/schemas/UnitEnum'
          - $ref: '#/components/schemas/BlankEnum'
        ingredient:
          allOf:
          - $ref: '#/components/schemas/Ingredient'
          readOnly: true
        note:
          type: string
          description: '"finely chopped".'
          maxLength: 200
        optional:
          type: boolean
        original_text:
          type: string
          title: Original wording
          description: The line as the recipe was written.
          maxLength: 300
      required:
      - amount
      - amount_max
      - id
      - ingredient
      - note
      - optional
      - original_text
      - unit
    IngredientOption:
      type: object
      description: An ingredient as the filters offer it, with the synonyms it can
        be found by.
      properties:
        slug:
          type: string
          maxLength: 100
          pattern: ^[-a-zA-Z0-9_]+$
        name:
          type: string
          description: 'The UK name: courgette, coriander, plain flour.'
          maxLength: 100
        synonyms:
          type: array
          items:
            type: string
            description: 'Another name, such as the US one: zucchini.'
          readOnly: true
      required:
      - name
      - slug
      - synonyms
    PhotoThumbnail:
      type: object
      properties:
        width:
          type: integer
          readOnly: true
        url:
          type: string
          format: uri
          readOnly: true
      required:
      - url
      - width
    Recipe:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        slug:
          type: string
          readOnly: true
          pattern: ^[-a-zA-Z0-9_]+$
        title:
          type: string
          maxLength: 200
        description:
          type: string
          maxLength: 300
        cuisines:
          type: array
          items:
            $ref: '#/components/schemas/Cuisine'
          readOnly: true
        difficulty:
          $ref: '#/components/schemas/DifficultyEnum'
        total_minutes:
          type: integer
          readOnly: true
        photo:
          allOf:
          - $ref: '#/components/schemas/RecipePhoto'
          readOnly: true
          nullable: true
        diet_tags:
          type: array
          items:
            $ref: '#/components/schemas/DietTag'
          readOnly: true
        courses:
          type: array
          items:
            $ref: '#/components/schemas/Course'
          readOnly: true
        prep_minutes:
          type: integer
          maximum: 2147483647
          minimum: 0
        cook_minutes:
          type: integer
          maximum: 2147483647
          minimum: 0
        extra_minutes:
          type: integer
          maximum: 2147483647
          minimum: 0
          description: Waiting time, such as marinating or proving.
        extra_label:
          type: string
          description: What the extra time is for, such as marinating, resting or
            proving.
          maxLength: 50
        servings:
          type: integer
          maximum: 32767
          minimum: 1
          nullable: true
          description: Leave empty when giving a yield.
        yield_amount:
          type: integer
          maximum: 32767
          minimum: 1
          nullable: true
          description: '"12" in "makes 12 cookies".'
        yield_unit:
          type: string
          description: '"cookies" in "makes 12 cookies".'
          maxLength: 50
        equipment:
          type: array
          items:
            $ref: '#/components/schemas/Equipment'
          readOnly: true
        one_pot:
          type: boolean
        source:
          type: string
          title: Source credit
          description: 'Where the recipe came from: an author, a website or a book.'
          maxLength: 300
        ingredient_lines:
          type: array
          items:
            $ref: '#/components/schemas/IngredientLine'
          readOnly: true
        ingredient_groups:
          type: array
          items:
            $ref: '#/components/schemas/IngredientGroup'
          readOnly: true
        steps:
          type: array
          items:
            $ref: '#/components/schemas/Step'
          readOnly: true
        diet_tag_conflicts:
          type: array
          items:
            $ref: '#/components/schemas/DietTagConflict'
          readOnly: true
      required:
      - cook_minutes
      - courses
      - cuisines
      - description
      - diet_tag_conflicts
      - diet_tags
      - difficulty
      - equipment
      - extra_label
      - extra_minutes
      - id
      - ingredient_groups
      - ingredient_lines
      - one_pot
      - photo
      - prep_minutes
      - servings
      - slug
      - source
      - steps
      - title
      - total_minutes
      - yield_amount
      - yield_unit
    RecipePhoto:
      type: object
      properties:
        thumbnails:
          type: array
          items:
            $ref: '#/components/schemas/PhotoThumbnail'
          readOnly: true
        author:
          type: string
          readOnly: true
        licence:
          type: string
          readOnly: true
        source_url:
          type: string
          format: uri
          readOnly: true
      required:
      - author
      - licence
      - source_url
      - thumbnails
    RecipeSummary:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        slug:
          type: string
          readOnly: true
          pattern: ^[-a-zA-Z0-9_]+$
        title:
          type: string
          maxLength: 200
        description:
          type: string
          maxLength: 300
        cuisines:
          type: array
          items:
            $ref: '#/components/schemas/Cuisine'
          readOnly: true
        difficulty:
          $ref: '#/components/schemas/DifficultyEnum'
        total_minutes:
          type: integer
          readOnly: true
        photo:
          allOf:
          - $ref: '#/components/schemas/RecipePhoto'
          readOnly: true
          nullable: true
        diet_tags:
          type: array
          items:
            $ref: '#/components/schemas/DietTag'
          readOnly: true
      required:
      - cuisines
      - description
      - diet_tags
      - difficulty
      - id
      - photo
      - slug
      - title
      - total_minutes
    StatusEnum:
      enum:
      - ok
      type: string
      description: '* `ok` - ok'
    Step:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        text:
          type: string
      required:
      - id
      - text
    UnitEnum:
      enum:
      - g
      - kg
      - ml
      - l
      - tsp
      - tbsp
      - cup
      - oz
      - lb
      - fl_oz
      - pinch
      - clove
      - tin
      - slice
      - bunch
      - handful
      type: string
      description: |-
        * `g` - g
        * `kg` - kg
        * `ml` - ml
        * `l` - l
        * `tsp` - tsp
        * `tbsp` - tbsp
        * `cup` - cup
        * `oz` - oz
        * `lb` - lb
        * `fl_oz` - fl oz
        * `pinch` - pinch
        * `clove` - clove
        * `tin` - tin
        * `slice` - slice
        * `bunch` - bunch
        * `handful` - handful
