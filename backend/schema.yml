openapi: 3.0.3
info:
  title: Tastebook API
  version: 0.1.0
  description: Recipe hub API
paths:
  /api/cuisines/:
    get:
      operationId: cuisines_list
      tags:
      - cuisines
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Cuisine'
          description: ''
  /api/health/:
    get:
      operationId: health_retrieve
      tags:
      - health
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          description: ''
  /api/recipes/:
    get:
      operationId: recipes_list
      parameters:
      - in: query
        name: cuisine
        schema:
          type: string
        description: Only recipes with the cuisine that has this slug. A blank or
          unknown slug means every cuisine.
      - in: query
        name: q
        schema:
          type: string
        description: Only recipes whose title contains this text, ignoring case and
          accents.
      tags:
      - recipes
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Recipe'
          description: ''
  /api/recipes/{slug}/:
    get:
      operationId: recipes_retrieve
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - recipes
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Recipe'
          description: ''
        '404':
          description: No recipe has this slug.
components:
  schemas:
    Cuisine:
      type: object
      properties:
        slug:
          type: string
          maxLength: 50
          pattern: ^[-a-zA-Z0-9_]+$
        name:
          type: string
          maxLength: 50
      required:
      - name
      - slug
    DatabaseEnum:
      enum:
      - ok
      - unavailable
      type: string
      description: |-
        * `ok` - ok
        * `unavailable` - unavailable
    Health:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/StatusEnum'
        database:
          $ref: '#/components/schemas/DatabaseEnum'
        version:
          type: string
      required:
      - database
      - status
      - version
    Recipe:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        slug:
          type: string
          readOnly: true
          pattern: ^[-a-zA-Z0-9_]+$
        title:
          type: string
          maxLength: 200
        description:
          type: string
          maxLength: 300
        cuisines:
          type: array
          items:
            $ref: '#/components/schemas/Cuisine'
          readOnly: true
      required:
      - cuisines
      - description
      - id
      - slug
      - title
    StatusEnum:
      enum:
      - ok
      type: string
      description: '* `ok` - ok'
