openapi: 3.0.3
info:
  title: Tastebook API
  version: 0.1.0
  description: Recipe hub API
paths:
  /api/health/:
    get:
      operationId: health_retrieve
      tags:
        - health
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
          description: ""
components:
  schemas:
    DatabaseEnum:
      enum:
        - ok
        - unavailable
      type: string
      description: |-
        * `ok` - ok
        * `unavailable` - unavailable
    Health:
      type: object
      properties:
        status:
          $ref: "#/components/schemas/StatusEnum"
        database:
          $ref: "#/components/schemas/DatabaseEnum"
      required:
        - database
        - status
    StatusEnum:
      enum:
        - ok
      type: string
      description: "* `ok` - ok"
