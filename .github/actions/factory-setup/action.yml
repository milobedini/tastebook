name: Factory setup
description: Installs the toolchains and starts Postgres before a factory stage run, so the agent can run every command in AGENTS.md.

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24
        cache: pnpm
    - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      with:
        enable-cache: true
    - name: Install dependencies
      shell: bash
      run: |
        pnpm install --frozen-lockfile
        cd backend && uv sync --locked && cp .env.example .env
    - name: Start Postgres
      shell: bash
      run: docker compose up -d --wait
    - name: Match CI's backend environment
      shell: bash
      run: |
        {
          echo "DJANGO_DEBUG=true"
          echo "DATABASE_URL=postgres://tastebook:tastebook@localhost:5432/tastebook"
        } >> "$GITHUB_ENV"
