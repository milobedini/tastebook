# Factory stage runs, dispatched by the mb-factory console. The stage workflow validates every payload field.
name: Factory

on:
  repository_dispatch:
    types: [factory-stage]

permissions:
  contents: read
  id-token: write

jobs:
  stage:
    uses: milobedini/mb-factory/.github/workflows/stage.yml@main
    with:
      run_id: ${{ github.event.client_payload.run_id }}
      model: ${{ github.event.client_payload.model }}
      prompt: ${{ github.event.client_payload.prompt }}
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      # The factory's own GitHub App, which can push workflow files.
      FACTORY_APP_CLIENT_ID: ${{ secrets.FACTORY_APP_CLIENT_ID }}
      FACTORY_APP_PRIVATE_KEY: ${{ secrets.FACTORY_APP_PRIVATE_KEY }}
      # The verify evidence store's token. Only named here does the factory environment's value reach the stage workflow.
      EVIDENCE_BLOB_READ_WRITE_TOKEN: ${{ secrets.EVIDENCE_BLOB_READ_WRITE_TOKEN }}
