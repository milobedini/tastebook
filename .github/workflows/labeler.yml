# Labels each PR by the paths it changes (.github/labeler.yml). `pull_request` rather than `pull_request_target`, as
# the factory's PRs come from this repo's own branches; a fork's PR gets a read-only token, so it isn't labelled.
name: Labeler

on:
  pull_request:

permissions:
  contents: read

jobs:
  label:
    name: Label
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
