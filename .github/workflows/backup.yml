# Dumps the production database into the private Blob store tastebook-backups every night and deletes dumps older
# than 30 days. A failed run shows red and GitHub emails whoever last changed the schedule. Restoring is in
# docs/architecture.md, Backups.
name: Backup

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

concurrency:
  group: backup
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backup:
    name: Back up production
    # The secrets live in the backups environment, which only main can use, so no other branch can read them.
    environment: backups
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @tastebook/backup
      # Production runs Postgres 18 and the runner's own client is older, which pg_dump refuses.
      - name: Install the Postgres 18 client
        run: |
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-18
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"
      - name: Dump, upload and prune
        run: pnpm --filter @tastebook/backup backup
        env:
          PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          BACKUP_BLOB_READ_WRITE_TOKEN: ${{ secrets.BACKUP_BLOB_READ_WRITE_TOKEN }}
