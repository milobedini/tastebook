# Dumps the production database into the private Blob store tastebook-backups every night and deletes dumps older
# than 30 days. First it clears expired sign-in limits, so neither production nor a dump keeps their IP addresses.
# A failed run shows red and GitHub emails whoever last changed the schedule. Restoring is in docs/architecture.md,
# Backups.
name: Backup

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

concurrency:
  group: backup
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  clear-sign-in-limits:
    name: Clear expired sign-in limits
    environment: backups
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: uv sync --locked
      - name: Clear
        # Settings refuse to load without a secret key; this command signs nothing, so a throwaway one does.
        run: DJANGO_SECRET_KEY="$(openssl rand -hex 32)" uv run python manage.py clear_expired_sign_in_limits
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}

  backup:
    name: Back up production
    needs: clear-sign-in-limits
    # A failed clear still shows red, but never costs a night's backup.
    if: ${{ !cancelled() }}
    # The secrets live in the backups environment, which only main can use, so no other branch can read them.
    environment: backups
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @tastebook/backup
      # Production runs Postgres 18 and the runner's own client is older, which pg_dump refuses.
      - name: Install the Postgres 18 client
        run: |
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-18
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"
      - name: Dump, upload and prune
        run: pnpm --filter @tastebook/backup backup
        env:
          PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          BACKUP_BLOB_READ_WRITE_TOKEN: ${{ secrets.BACKUP_BLOB_READ_WRITE_TOKEN }}
