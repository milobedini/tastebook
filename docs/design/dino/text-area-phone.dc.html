<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Text area at phone width</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/dino/tokens.css">
<link rel="stylesheet" href="ds/dino/components/bundle.css">
<script src="ds/dino/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
.pn{color-scheme:dark}
.serif{font-family:var(--font-serif);font-weight:400}
.cap{font-size:13px;line-height:17px;font-weight:700;color:var(--color-muted)}
.fld{display:flex;flex-direction:column;gap:6px;min-width:0}
.lbl{font-size:15px;line-height:20px;font-weight:800}
.help{margin:0;font-size:13px;line-height:17px;font-weight:700;color:var(--color-muted)}
.err{margin:0;display:flex;gap:6px;align-items:flex-start;font-size:13px;line-height:17px;font-weight:700;color:var(--color-danger)}
.ta{display:block;width:100%;min-width:0;min-height:96px;border-radius:24px;border:2px solid var(--color-field);background:transparent;color:var(--color-ink);padding:10px 18px;box-sizing:border-box;font:700 16px/24px var(--font-sans);outline:0;resize:none;field-sizing:content;overflow-wrap:break-word;transition:border-color 120ms ease-out}
.ta::placeholder{color:var(--color-muted);font-weight:600;opacity:1}
.ta:hover:not([aria-invalid="true"]):not([aria-disabled="true"]){border-color:var(--color-muted)}
.ta:focus-visible:not([aria-invalid="true"]),.ta.is-focus{border-color:var(--color-ink)}
.ta:focus-visible,.ta.is-focus{outline:1px solid var(--color-ink);outline-offset:0}
.ta[aria-invalid="true"]{border-color:var(--color-danger)}
@media (prefers-reduced-motion: reduce){.ta{transition:none}}
</style>
</helmet>
<div class="pn" style="width: 390px; height: 700px; box-sizing: border-box; padding: 24px 20px; background: var(--color-ground); color: var(--color-ink); font-family: var(--font-sans); display: flex; flex-direction: column; gap: 32px">

  <header style="display: flex; flex-direction: column; gap: 6px">
    <span class="cap">Phone, 390 px · 20 px gutters</span>
    <h1 class="serif" style="margin: 0; font-size: 46px; line-height: 44px">Text area</h1>
  </header>

  <div style="display: flex; flex-direction: column; gap: 24px">
    <div class="fld">
      <label class="lbl" for="p1">Description</label>
      <textarea id="p1" class="ta" aria-describedby="p1-h">A weeknight curry from Nonna’s notebook: chickpeas simmered with tomatoes, ginger and garam masala until thick. Good with rice or flatbread.</textarea>
      <p id="p1-h" class="help">Shown under the recipe’s name.</p>
    </div>
    <div class="fld">
      <label class="lbl" for="p2">Step 1</label>
      <textarea id="p2" class="ta is-focus">Fry the onions in the oil until soft and golden, about 10 minutes.</textarea>
    </div>
    <div class="fld">
      <label class="lbl" for="p3">Step 2</label>
      <textarea id="p3" class="ta" aria-invalid="true" aria-describedby="p3-e" placeholder="Like “Add the garlic.”"></textarea>
      <p id="p3-e" class="err"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; margin-top: 1px"><circle cx="12" cy="12" r="10"></circle><path d="M12 8v4M12 16h.01"></path></svg>Write the step, or remove it.</p>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":700}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
