services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: tastebook
      POSTGRES_PASSWORD: tastebook
      POSTGRES_DB: tastebook
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tastebook"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  db-data:
